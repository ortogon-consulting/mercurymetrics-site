<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | MercuryMetrics</title>
  <meta name="description" content="The requested MercuryMetrics page could not be found." />
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/favicon-512.png" />
  <style>
    :root {
      --mm-bg: #f4f0e8;
      --mm-paper: #fbf9f4;
      --mm-ink: #0d1728;
      --mm-muted: #657083;
      --mm-line: rgba(13, 23, 40, 0.14);
      --mm-gold: #d9b45e;
      --mm-teal: #119c93;
      --mm-teal-hover: #0b887f;
      --display: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --body: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, var(--mm-bg) 0%, #e7e8e3 100%);
      color: var(--mm-ink);
      font-family: var(--body);
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(32px, 6vw, 56px);
      border: 1px solid var(--mm-line);
      border-radius: 28px;
      background: rgba(251, 249, 244, 0.92);
      box-shadow: 0 20px 60px rgba(13, 23, 40, 0.08);
      text-align: center;
    }

    .brand {
      margin-bottom: 18px;
      color: var(--mm-gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-family: var(--display);
      font-size: clamp(40px, 8vw, 64px);
      line-height: .96;
      letter-spacing: -.05em;
    }

    p {
      margin: 0 auto;
      max-width: 34rem;
      color: var(--mm-muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 28px;
      padding: 0 23px;
      border: 1px solid var(--mm-teal);
      border-radius: 999px;
      background: var(--mm-teal);
      color: #fff;
      font-size: 14px;
      font-weight: 850;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .btn:hover {
      background: var(--mm-teal-hover);
      border-color: var(--mm-teal-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">MercuryMetrics</div>
    <h1>Page not found.</h1>
    <p>The page you requested could not be found. Return to the MercuryMetrics homepage.</p>
    <a class="btn" href="/">Back to homepage</a>
  </main>
  <script type="module" src="/assets/js/telemetry.mjs"></script>
</body>
</html>
